<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1000" role="img" aria-labelledby="title desc">
  <title id="title">Weathered American flag texture</title>
  <desc id="desc">A stylized field of red and white stripes with a blue star field for use inside display lettering.</desc>
  <defs>
    <pattern id="stripes" width="1900" height="153.846" patternUnits="userSpaceOnUse">
      <rect width="1900" height="76.923" fill="#b22234"/>
      <rect y="76.923" width="1900" height="76.923" fill="#f7f4ec"/>
    </pattern>
    <pattern id="stars" width="110" height="90" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="18" r="7" fill="#fff"/>
      <circle cx="74" cy="44" r="7" fill="#fff"/>
      <circle cx="20" cy="72" r="7" fill="#fff"/>
    </pattern>
    <linearGradient id="wear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".08"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect width="1900" height="1000" fill="url(#stripes)"/>
  <rect width="760" height="538.46" fill="#263c78"/>
  <rect width="760" height="538.46" fill="url(#stars)"/>
  <rect width="1900" height="1000" fill="url(#wear)" style="mix-blend-mode:multiply"/>
</svg>
